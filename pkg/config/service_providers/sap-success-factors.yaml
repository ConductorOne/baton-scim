apiEndpoint: "https://sandbox.api.sap.com/successfactorsfoundation/rest/iam/scim/v2"
hasScimHeader: true
auth:
  authType: "apiKey"
  apiKeyPrefix: ""
user:
  id: "id"
  userName: "userName"
  displayName: "displayName"
  firstName: "name.givenName"
  lastName: "name.familyName"
  active: "active"
  skipUserEmails: true
  hasGroupsOnUser: true
  userGroup:
    id: "value"
    name: "display"
    path: "groups"
group:
  id: "value"
  displayName: "display"
pagination:
  totalResults: "totalResults"
  itemsPerPage: "itemsPerPage"
  startIndex: "startIndex"
provisioning:
  addUserToGroup:
    schemas: "urn:ietf:params:scim:api:messages:2.0:PatchOp"
    op: "add"
    path: "members"
    valuePath: "value"
  removeUserFromGroup:
    schemas: "urn:ietf:params:scim:api:messages:2.0:PatchOp"
    op: "remove"
    path: "members"
    valuePath: "value"
